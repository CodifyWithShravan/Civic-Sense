version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: civic-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: civicdb
      POSTGRES_USER: civicuser
      POSTGRES_PASSWORD: civicpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicuser -d civicdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
