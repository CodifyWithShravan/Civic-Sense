# ==============================================================================
# CivicAdvocate - PostgreSQL Production Profile
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civicdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civicuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:civicpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 web console when running on real PostgreSQL
spring.h2.console.enabled=false
