# ==============================================================================
# CivicAdvocate - Application Configuration
# ==============================================================================
spring.application.name=civic-backend
server.port=8080

# ------------------------------------------------------------------------------
# Servlet & Multipart Upload Configuration
# ------------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ------------------------------------------------------------------------------
# Database Configuration (H2 In-Memory with PostgreSQL Compatibility)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:civicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------------------------------------------
# Mail Configuration (Spring Mail)
# ------------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:civicadvocate.agent@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mock_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# When false, EmailDispatchService outputs structured logs to console & audit trail without failing
app.mail.enabled=${APP_MAIL_ENABLED:false}

# ------------------------------------------------------------------------------
# Twitter / X API v2 Configuration
# ------------------------------------------------------------------------------
app.twitter.api-key=${TWITTER_API_KEY:}
app.twitter.api-secret=${TWITTER_API_SECRET:}
app.twitter.bearer-token=${TWITTER_BEARER_TOKEN:}
app.twitter.access-token=${TWITTER_ACCESS_TOKEN:}
app.twitter.access-token-secret=${TWITTER_ACCESS_TOKEN_SECRET:}
# When false, TwitterService outputs formatted alert tweets to console & audit trail without failing
app.twitter.enabled=${APP_TWITTER_ENABLED:false}

# ------------------------------------------------------------------------------
# Autonomous SLA Escalation Rules (Days elapsed from T=0)
# ------------------------------------------------------------------------------
app.sla.tier1-days=3
app.sla.tier2-days=7
app.sla.tier3-days=14

# SLA Monitoring Cron (Defaults to checking every 5 minutes)
app.escalation.cron=0 */5 * * * *

# ------------------------------------------------------------------------------
# Local Uploads Directory
# ------------------------------------------------------------------------------
app.upload.dir=./uploads
